<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chip & Stock Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #f0f2f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 24px; color: #ffffff; }
        .timestamp { font-size: 14px; color: #8b949e; }
        .status-badge { background: #238636; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #58a6ff; }
        .ticker-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; }
        .ticker-name { font-size: 18px; font-weight: bold; color: #ffffff; }
        .ticker-symbol { font-size: 12px; color: #8b949e; margin-left: 5px; }
        .price { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .change { font-size: 16px; font-weight: bold; }
        .positive { color: #39d353; }
        .negative { color: #f85149; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; font-size: 13px; text-align: center; }
        .metric-box { background: #0e1117; padding: 8px; border-radius: 6px; }
        .metric-label { color: #8b949e; margin-bottom: 4px; font-size: 11px; }
        .signal-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; background: #21262d; border-left: 4px solid #8b949e; }
        .signal-title { font-weight: bold; margin-bottom: 5px; }
        .signal-desc { font-size: 12px; color: #c9d1d9; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>💡 Real-Time Geopolitical & Chip Monitor</h1>
                <div class="timestamp" id="update-time">Sincronizzazione dei flussi...</div>
            </div>
            <div class="status-badge">🔴 LIVE BROWSER FEED</div>
        </header>

        <div class="grid" id="dashboard-grid"></div>
    </div>

    <script>
        const TICKERS = {
            "STM.MI": { nome: "STMicroelectronics", stooq: "stm.it", valuta: "€" },
            "LDO.MI": { nome: "Leonardo S.p.A.", stooq: "ldo.it", valuta: "€" },
            "NVDA": { nome: "NVIDIA Corp.", stooq: "nvda.us", valuta: "$" },
            "TSM": { nome: "Taiwan Semiconductor", stooq: "tsm.us", valuta: "$" },
            "ASML": { nome: "ASML Holding", stooq: "asml.us", valuta: "$" },
            "BTC-USD": { nome: "Bitcoin", stooq: null, valuta: "$" }
        };

        let datiAnalisiPython = {};

        function scaricaQuotazioniIstantanee() {
            const grid = document.getElementById('dashboard-grid');
            
            // Passo 1: Scarica gli indicatori lenti generati da Python
            fetch('analisi.json?nocache=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    datiAnalisiPython = data.analisi || {};
                    
                    // Passo 2: Scarica i prezzi al secondo usando le API sbloccate in parallelo
                    const promessePrezzi = Object.keys(TICKERS).map(ticker => {
                        if (ticker === "BTC-USD") {
                            return fetch('https://cryptocompare.com')
                                .then(res => res.json())
                                .then(cData => {
                                    const raw = cData.RAW.BTC.USD;
                                    return { ticker, prezzo: raw.PRICE, variazione: raw.CHANGEPCT24HOUR };
                                }).catch(() => null);
                        } else {
                            // API Stooq in formato CSV/JSON leggero sbloccato senza CORS
                            const codiceStooq = TICKERS[ticker].stooq;
                            return fetch(`https://stooq.com{codiceStooq}`)
                                .then(res => res.json())
                                .then(sData => {
                                    const riga = sData.aq[0];
                                    return {
                                        ticker,
                                        prezzo: parseFloat(riga.l1),
                                        variazione: parseFloat(riga.c1)
                                    };
                                }).catch(() => null);
                        }
                    });

                    return Promise.all(promessePrezzi);
                })
                .then(risultatiLive => {
                    grid.innerHTML = '';

                    Object.keys(TICKERS).forEach(ticker => {
                        const infoFissa = TICKERS[ticker];
                        const datiLive = risultatiLive.find(r => r && r.ticker === ticker);
                        const fallbackPython = datiAnalisiPython[ticker];

                        // Prendi il prezzo dell'ultimo secondo dal browser, usa Python solo come ruota di scorta
                        const prezzoFinale = datiLive ? datiLive.prezzo : (fallbackPython ? parseFloat(fallbackPython.prezzo) : 0.0);
                        const variazioneFinale = datiLive ? datiLive.variazione : (fallbackPython ? parseFloat(fallbackPython.variazione) : 0.0);

                        const isPositive = variazioneFinale >= 0;
                        const changeClass = isPositive ? 'positive' : 'negative';
                        const changeSign = isPositive ? '+' : '';

                        let bloccoAlgoritmico = '';
                        if (fallbackPython) {
                            let signalColor = '#8b949e';
                            if(fallbackPython.segnale.includes('COMPRA')) signalColor = '#39d353';
                            if(fallbackPython.segnale.includes('VENDI')) signalColor = '#f85149';
                            if(fallbackPython.segnale.includes('TIENI')) signalColor = '#e3b341';

                            bloccoAlgoritmico = `
                                <div class="metrics">
                                    <div class="metric-box"><div class="metric-label">SMA 20</div><strong>${fallbackPython.sma20}</strong></div>
                                    <div class="metric-box"><div class="metric-label">SMA 50</div><strong>${fallbackPython.sma50}</strong></div>
                                    <div class="metric-box"><div class="metric-label">RSI 14</div><strong>${fallbackPython.rsi}</strong></div>
                                </div>
                                <div class="signal-box" style="border-left-color: ${signalColor}">
                                    <div class="signal-title">${fallbackPython.segnale}</div>
                                    <div class="signal-desc">${fallbackPython.motivazione}</div>
                                </div>
                            `;
                        }

                        const cardHTML = `
                            <div class="card">
                                <div class="ticker-header">
                                    <div>
                                        <span class="ticker-name">${infoFissa.nome}</span>
                                        <span class="ticker-symbol">${ticker}</span>
                                    </div>
                                </div>
                                <div class="price">
                                    ${infoFissa.valuta} ${prezzoFinale.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </div>
                                <div class="change ${changeClass}">
                                    ${changeSign}${variazioneFinale.toFixed(2)}% Oggi
                                </div>
                                ${bloccoAlgoritmico}
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    });

                    const ora = new Date();
                    document.getElementById('update-time').innerText = "Prezzi istantanei al secondo (Browser) - Ultimo controllo: " + ora.toLocaleTimeString('it-IT');
                })
                .catch(() => {
                    document.getElementById('update-time').innerText = "Allineamento flussi centralizzati...";
                });
        }

        // Avvia immediatamente il feed visivo e aggiorna i prezzi dal browser ogni 10 secondi
        scaricaQuotazioniIstantanee();
        setInterval(scaricaQuotazioniIstantanee, 10000);
    </script>
</body>
</html>
