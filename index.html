<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chip & Stock Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #f0f2f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 24px; color: #ffffff; }
        .timestamp { font-size: 14px; color: #8b949e; }
        .status-badge { background: #238636; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #58a6ff; }
        .ticker-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; }
        .ticker-name { font-size: 18px; font-weight: bold; color: #ffffff; }
        .ticker-symbol { font-size: 12px; color: #8b949e; margin-left: 5px; }
        .price { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .change { font-size: 16px; font-weight: bold; }
        .positive { color: #39d353; }
        .negative { color: #f85149; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; font-size: 13px; text-align: center; }
        .metric-box { background: #0e1117; padding: 8px; border-radius: 6px; }
        .metric-label { color: #8b949e; margin-bottom: 4px; font-size: 11px; }
        .signal-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; background: #21262d; border-left: 4px solid #8b949e; }
        .signal-title { font-weight: bold; margin-bottom: 5px; }
        .signal-desc { font-size: 12px; color: #c9d1d9; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>💡 Real-Time Geopolitical & Chip Monitor</h1>
                <div class="timestamp" id="update-time">Caricamento dati dal server...</div>
            </div>
            <div class="status-badge">🟢 SERVER DATI ATTIVO</div>
        </header>

        <div class="grid" id="dashboard-grid"></div>
    </div>

    <script>
        const TICKERS = ["STM.MI", "LDO.MI", "NVDA", "TSM", "ASML", "BTC-USD"];

        function caricaDatiInfrastruttura() {
            const grid = document.getElementById('dashboard-grid');
            
            fetch('analisi.json?v=' + new Date().getTime(), { cache: "no-store" })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('update-time').innerText = "Ultimo aggiornamento flussi: " + data.ultimo_aggiornamento_algoritmo + " (Aggiornato ogni 5 min automaticamente)";
                    
                    grid.innerHTML = ''; 
                    const analisi = data.analisi;
                    
                    TICKERS.forEach(ticker => {
                        const asset = analisi[ticker];
                        if (!asset) return; 

                        const prezzoNum = parseFloat(asset.prezzo);
                        const variazioneNum = parseFloat(asset.variazione);
                        
                        const isPositive = variazioneNum >= 0;
                        const changeClass = isPositive ? 'positive' : 'negative';
                        const changeSign = isPositive ? '+' : '';
                        const valuta = ticker.includes('.MI') || ticker.includes('ASML') ? '€' : '$';

                        let signalColor = '#8b949e';
                        if(asset.segnale.includes('COMPRA')) signalColor = '#39d353';
                        if(asset.segnale.includes('VENDI')) signalColor = '#f85149';
                        if(asset.segnale.includes('TIENI')) signalColor = '#e3b341';

                        const cardHTML = `
                            <div class="card">
                                <div class="ticker-header">
                                    <div>
                                        <span class="ticker-name">${asset.nome}</span>
                                        <span class="ticker-symbol">${ticker}</span>
                                    </div>
                                </div>
                                <div class="price">
                                    ${valuta} ${prezzoNum.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </div>
                                <div class="change ${changeClass}">
                                    ${changeSign}${variazioneNum.toFixed(2)}% Oggi
                                </div>
                                <div class="metrics">
                                    <div class="metric-box"><div class="metric-label">SMA 20</div><strong>${asset.sma20}</strong></div>
                                    <div class="metric-box"><div class="metric-label">SMA 50</div><strong>${asset.sma50}</strong></div>
                                    <div class="metric-box"><div class="metric-label">RSI 14</div><strong>${asset.rsi}</strong></div>
                                </div>
                                <div class="signal-box" style="border-left-color: ${signalColor}">
                                    <div class="signal-title">${asset.segnale}</div>
                                    <div class="signal-desc">${asset.motivazione}</div>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    });
                })
                .catch(() => {
                    document.getElementById('update-time').innerText = "Allineamento dati centralizzati...";
                });
        }

        caricaDatiInfrastruttura();
        setInterval(caricaDatiInfrastruttura, 15000);
    </script>
</body>
</html>
