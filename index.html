<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chip & Stock Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #f0f2f6; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { border-bottom: 1px solid #30363d; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 24px; color: #ffffff; }
        .timestamp { font-size: 14px; color: #8b949e; }
        .status-badge { background: #238636; color: white; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: #58a6ff; }
        .ticker-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 15px; }
        .ticker-name { font-size: 18px; font-weight: bold; color: #ffffff; }
        .ticker-symbol { font-size: 12px; color: #8b949e; margin-left: 5px; }
        .price { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .change { font-size: 16px; font-weight: bold; }
        .positive { color: #39d353; }
        .negative { color: #f85149; }
        .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; padding-top: 15px; border-top: 1px solid #30363d; font-size: 13px; text-align: center; }
        .metric-box { background: #0e1117; padding: 8px; border-radius: 6px; }
        .metric-label { color: #8b949e; margin-bottom: 4px; font-size: 11px; }
        .signal-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 14px; background: #21262d; border-left: 4px solid #8b949e; }
        .signal-title { font-weight: bold; margin-bottom: 5px; }
        .signal-desc { font-size: 12px; color: #c9d1d9; line-height: 1.4; }
        .update-bar { height: 3px; background: #238636; width: 100%; transition: width 1s linear; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>💡 Real-Time Geopolitical & Chip Monitor</h1>
                <div class="timestamp" id="update-time">Connessione ai mercati live...</div>
                <div class="timestamp" id="algo-time" style="margin-top: 5px; font-size: 12px; color: #58a6ff;">Caricamento report macro...</div>
            </div>
            <div class="status-badge">🔴 LIVE TICKS</div>
        </header>

        <div id="progress-bar" class="update-bar"></div>
        <div class="grid" id="dashboard-grid"></div>
    </div>

    <script>
        const TICKERS = {
            "STM": "STMicroelectronics",
            "LDO.MI": "Leonardo S.p.A.",
            "NVDA": "NVIDIA Corp.",
            "TSM": "Taiwan Semiconductor",
            "ASML": "ASML Holding",
            "BTC-USD": "Bitcoin"
        };

        let datiAnalisiPython = {};
        let secondiMancanti = 30;

        // 1. CARICA L'ANALISI STATICA GENERATA DA GITHUB ACTIONS (OGNI 5 MINUTI)
        function caricaAnalisiPython() {
            return fetch('analisi.json?t=' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.json();
                })
                .then(data => {
                    datiAnalisiPython = data.analisi || {};
                    document.getElementById('algo-time').innerText = "Analisi Geopolitica aggiornata al: " + data.ultimo_aggiornamento_algoritmo;
                })
                .catch(() => {
                    document.getElementById('algo-time').innerText = "Analisi Geopolitica: Modalità Fallback attiva (Dati locali non trovati)";
                });
        }

        // 2. RECUPERA I PREZZI IN TEMPO REALE DAL BROWSER (OGNI 30 SECONDI)
        function recuperaPrezziVeroTempoReale() {
            const grid = document.getElementById('dashboard-grid');
            const listaTickers = Object.keys(TICKERS).join(',');
            
            // Endpoint ufficiale Yahoo Finance incapsulato nel proxy AllOrigins per bypassare il blocco CORS del browser
            const urlYahoo = `https://yahoo.com{listaTickers}`;
            const urlProxy = `https://allorigins.win{encodeURIComponent(urlYahoo)}`;
            
            fetch(urlProxy)
                .then(res => {
                    if (!res.ok) throw new Error('Errore di rete del Proxy');
                    return res.json();
                })
                .then(wrapper => {
                    // AllOrigins restituisce i dati reali come stringa JSON nel campo 'contents'
                    const data = JSON.parse(wrapper.contents);
                    const quotes = data.quoteResponse.result;
                    
                    grid.innerHTML = ''; // Svuota la griglia prima del rendering
                    
                    quotes.forEach(quote => {
                        const ticker = quote.symbol;
                        const nome = TICKERS[ticker] || quote.shortName;
                        const prezzo = quote.regularMarketPrice || quote.mark || 0;
                        const variazione = quote.regularMarketChangePercent || 0;
                        
                        const isPositive = variazione >= 0;
                        const changeClass = isPositive ? 'positive' : 'negative';
                        const changeSign = isPositive ? '+' : '';
                        const valuta = ['LDO.MI', 'ASML', 'STM'].includes(ticker) ? '€' : '$';

                        // Associa l'analisi calcolata in background dal file JSON di Python
                        const haAnalisi = datiAnalisiPython[ticker];
                        let bloccoAlgoritmico = '';

                        if (haAnalisi) {
                            let signalColor = '#8b949e';
                            if(haAnalisi.segnale.includes('COMPRA')) signalColor = '#39d353';
                            if(haAnalisi.segnale.includes('VENDI')) signalColor = '#f85149';
                            if(haAnalisi.segnale.includes('TIENI')) signalColor = '#e3b341';

                            bloccoAlgoritmico = `
                                <div class="metrics">
                                    <div class="metric-box"><div class="metric-label">SMA 20</div><strong>${haAnalisi.sma20}</strong></div>
                                    <div class="metric-box"><div class="metric-label">SMA 50</div><strong>${haAnalisi.sma50}</strong></div>
                                    <div class="metric-box"><div class="metric-label">RSI 14</div><strong>${haAnalisi.rsi}</strong></div>
                                </div>
                                <div class="signal-box" style="border-left-color: ${signalColor}">
                                    <div class="signal-title">${haAnalisi.segnale}</div>
                                    <div class="signal-desc">${haAnalisi.motivazione}</div>
                                </div>
                            `;
                        }

                        const cardHTML = `
                            <div class="card">
                                <div class="ticker-header">
                                    <div>
                                        <span class="ticker-name">${nome}</span>
                                        <span class="ticker-symbol">${ticker}</span>
                                    </div>
                                </div>
                                <div class="price">
                                    ${valuta} ${prezzo.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                </div>
                                <div class="change ${changeClass}">
                                    ${changeSign}${variazione.toFixed(2)}% Oggi
                                </div>
                                ${bloccoAlgoritmico}
                            </div>
                        `;
                        grid.innerHTML += cardHTML;
                    });

                    const ora = new Date();
                    document.getElementById('update-time').innerText = "Quotazioni Live (Aggiornamento automatico browser): " + ora.toLocaleTimeString('it-IT');
                    secondiMancanti = 30; // Resetta il timer
                })
                .catch(err => {
                    console.error("Errore feed diretto:", err);
                    document.getElementById('update-time').innerText = "Errore feed dati. Nuovo tentativo a breve...";
                    secondiMancanti = 5; // In caso di errore accelera il prossimo tentativo
                });
        }

        // 3. GESTIONE DEL TIMER VISIVO DELLA PROGRESS BAR (1 TICK AL SECONDO)
        setInterval(() => {
            secondiMancanti--;
            const progBar = document.getElementById('progress-bar');
            if (progBar) {
                // Calcola la larghezza percentuale rimanente del timer
                const percentuale = Math.max(0, (secondiMancanti / 30) * 100);
                progBar.style.width = percentuale + '%';
            }

            if (secondiMancanti <= 0) {
                recuperaPrezziVeroTempoReale();
            }
        }, 1000);

        // 4. INIZIALIZZAZIONE ALL'APERTURA DELLA PAGINA
        caricaAnalisiPython().then(() => {
            recuperaPrezziVeroTempoReale();
        });
